# Save this file as: .github/workflows/metrics.yml  (in your <username>/<username> profile repo)
#
# This generates your GitHub stats, top languages, and contribution calendar
# as a static SVG committed into your OWN repo — so it can never go blank
# from a third-party demo server being rate-limited or paused (which is
# almost certainly why your old README badges weren't loading).
#
# After adding this file, GitHub will run it automatically. First run:
# go to your repo's "Actions" tab and click "Run workflow" once manually.

name: Update Profile Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_calendar: yes
          plugin_achievements: yes
          plugin_achievements_threshold: C
